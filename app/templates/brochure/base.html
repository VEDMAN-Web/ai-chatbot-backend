<!DOCTYPE html>
<html lang="{{ data.language or 'en' }}">
<head>
  <meta charset="utf-8"/>
  <title>{{ data.name or data.property_id or 'Property Brochure' }}</title>
  <style>
    @font-face {
      font-family: "Brochure Serif";
      src: url("{{ font_urls.serif_regular }}") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Brochure Serif";
      src: url("{{ font_urls.serif_bold }}") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Brochure Serif";
      src: url("{{ font_urls.serif_italic }}") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: "Brochure Sans";
      src: url("{{ font_urls.sans_regular }}") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Brochure Sans";
      src: url("{{ font_urls.sans_bold }}") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "Brochure Thai";
      src: url("{{ font_urls.thai_regular }}") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Brochure Thai";
      src: url("{{ font_urls.thai_bold }}") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --accent: {{ theme.accent }};
      --sage: {{ theme.sage }};
      --cream: {{ theme.cream }};
      --ink: {{ theme.ink }};
      --muted: {{ theme.muted }};
      --paper: {{ theme.paper }};
      --serif: "Brochure Serif", "Brochure Thai", serif;
      --sans: "Brochure Sans", "Brochure Thai", sans-serif;
    }

    @page {
      size: A4 landscape;
      margin: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 297mm;
      height: 210mm;
      page-break-after: always;
      break-after: page;
      position: relative;
      overflow: hidden;
      background: var(--paper);
    }
    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    h1, h2, h3, .display {
      font-family: var(--serif);
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .label-caps {
      font-family: var(--sans);
      font-size: 9pt;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .body-text {
      font-family: var(--sans);
      font-size: 10pt;
      line-height: 1.55;
      color: var(--ink);
    }

    .thin-rule {
      width: 48px;
      height: 1px;
      background: var(--ink);
      opacity: 0.45;
      border: 0;
      margin: 14px auto;
    }

    .img-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .section-marker {
      font-size: 1px;
      color: transparent;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0.01;
    }
  </style>
</head>
<body>
{% for page in pages %}
  {% set prepared = page.prepared %}
  {% include page.template %}
{% endfor %}
{% if ai_footer %}
<div class="ai-footer-note" style="position:fixed;bottom:3mm;left:0;right:0;text-align:center;font-size:6pt;color:var(--muted);letter-spacing:0.02em;">
  {{ ai_footer }}
</div>
{% endif %}
</body>
</html>
