<section class="page highlights-page" data-section="highlights">
  <span class="section-marker">SECTION:highlights</span>
  <div class="hl-copy">
    <h2 class="hl-title">{{ labels.highlights_title }}</h2>
    <ul class="hl-timeline">
      {% for item in prepared.highlights or data.highlights %}
      <li><span class="hl-node"></span><span class="hl-text">{{ item }}</span></li>
      {% endfor %}
    </ul>
  </div>
  <div class="hl-media">
    {% if prepared.side_image %}
    <img class="img-cover" src="{{ prepared.side_image }}" alt=""/>
    {% elif data.images and data.images|length > 1 %}
    <img class="img-cover" src="{{ data.images[1] }}" alt=""/>
    {% elif data.hero_image %}
    <img class="img-cover" src="{{ data.hero_image }}" alt=""/>
    {% else %}
    <div class="hl-fallback"></div>
    {% endif %}
  </div>
</section>
<style>
  .highlights-page {
    display: grid;
    grid-template-columns: 55% 45%;
  }
  .hl-copy {
    padding: 22mm 18mm 18mm 22mm;
  }
  .hl-title {
    font-size: 26pt;
    margin-bottom: 14mm;
    max-width: 120mm;
  }
  .hl-timeline {
    list-style: none;
    border-left: 1px solid rgba(0,0,0,0.15);
    margin-left: 4mm;
    padding-left: 0;
  }
  .hl-timeline li {
    position: relative;
    padding: 4mm 0 4mm 10mm;
  }
  .hl-node {
    position: absolute;
    left: -2.2mm;
    top: 6mm;
    width: 4mm;
    height: 4mm;
    border-radius: 50%;
    background: var(--accent);
    border: 1.5px solid var(--paper);
  }
  .hl-text {
    display: inline-block;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 20px;
    padding: 3mm 5mm;
    font-size: 10pt;
    background: #fff;
  }
  .hl-media { overflow: hidden; background: var(--cream); }
  .hl-fallback {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, var(--cream), var(--sage));
  }
</style>
