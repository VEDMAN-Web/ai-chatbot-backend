<section class="page gallery-page" data-section="gallery">
  <span class="section-marker">SECTION:gallery</span>
  {% set imgs = prepared.images or data.images %}
  <div class="gallery-grid gallery-count-{{ imgs|length if imgs|length <= 4 else 4 }}">
    {% for src in imgs[:4] %}
    <div class="gallery-cell gallery-cell-{{ loop.index }}">
      <img class="img-cover" src="{{ src }}" alt=""/>
    </div>
    {% endfor %}
  </div>
</section>
<style>
  .gallery-page { background: #111; }
  .gallery-grid {
    display: grid;
    width: 100%;
    height: 100%;
    gap: 0;
  }
  .gallery-count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .gallery-count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .gallery-count-3 {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }
  .gallery-count-3 .gallery-cell-3 { grid-column: 1 / 3; }
  .gallery-count-4 {
    grid-template-columns: 1fr 1.15fr;
    grid-template-rows: 1fr 1fr 1fr;
  }
  .gallery-count-4 .gallery-cell-1 { grid-row: 1 / 3; }
  .gallery-count-4 .gallery-cell-2 { grid-column: 2; grid-row: 1 / 4; }
  .gallery-count-4 .gallery-cell-3 { grid-row: 3; }
  .gallery-count-4 .gallery-cell-4 { display: none; }
  /* 4 images: left stack + right tall column (classic reference rhythm) */
  .gallery-cell { overflow: hidden; min-height: 0; }
</style>
