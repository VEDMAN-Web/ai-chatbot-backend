# Deploys ONLY the staging branch to the isolated TEST project. Never touches production/Railway.
# Keyless auth: GitHub OIDC -> Workload Identity Federation (restricted to this repo and the staging branch).
name: Deploy backend to staging
on:
  push:
    branches: [staging]
  workflow_dispatch:
concurrency: deploy-staging
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/716369583900/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: gh-deployer@varsovia-test-clone-26.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run (existing service, keeps env and secrets)
        run: |
          gcloud run deploy staging-chatbot-backend \
            --project varsovia-test-clone-26 \
            --region asia-southeast1 \
            --source . \
            --quiet
      - name: Health check
        run: |
          URL=$(gcloud run services describe staging-chatbot-backend --project varsovia-test-clone-26 --region asia-southeast1 --format='value(status.url)')
          curl -fsS "$URL/health"
