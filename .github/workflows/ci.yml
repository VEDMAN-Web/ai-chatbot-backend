name: Backend CI
on:
  pull_request:
  push:
    branches: [staging]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENABLE_FIRESTORE_SYNC: "false"
      OPENAI_API_KEY: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # Tests that need LIVE Firestore credentials (or pandas, missing from requirements.txt) fail
      # identically on main, so they are skipped here. They run on the real staging backend instead.
      - run: >-
          python -m pytest -q tests
          --ignore=tests/test_firestore_auth.py
          --ignore=tests/test_firestore_integration.py
          --deselect tests/test_admin_auth_and_audit_apis.py::test_forgot_password_generates_token_and_rejects_invalid_email
          --deselect tests/test_admin_auth_and_audit_apis.py::test_reset_password_flow_and_tamper_rejection
          --deselect tests/test_admin_auth_and_audit_apis.py::test_change_password_endpoint
          --deselect tests/test_admin_auth_and_audit_apis.py::test_admin_register_endpoint
          --deselect tests/test_admin_auth_and_audit_apis.py::test_admin_activity_logs_api
          --deselect tests/test_admin_auth_and_audit_apis.py::test_data_change_history_api
          --deselect tests/test_admin_batch_operations.py::test_parse_excel_file
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chatbot-backend:ci .
